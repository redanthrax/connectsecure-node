packages:
  - '.'

overrides:
  brace-expansion: '>=5.0.8'
  lodash: '>=4.18.0'
  uuid: '11.1.1'
  n8n-workflow: '2.28.1'

onlyBuiltDependencies:
  - isolated-vm

ignoredBuiltDependencies: []

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

blockExoticSubdeps: true

strictDepBuilds: true

engineStrict: true
nodeVersion: 22.22.3

managePackageManagerVersions: true

# pnpm audit exceptions — same policy as osv-scanner.toml: dev-only, unshipped, no fix available.
auditConfig:
  ignoreGhsas:
    # zod <4.6.6 memory exhaustion; zod 3.x has no patched release. Dev-only peer of
    # n8n-workflow, never shipped. Revisit by 2027-01-24 or once n8n-workflow moves to zod >=4.6.6.
    - GHSA-mrhx-c7xc-m3w5
